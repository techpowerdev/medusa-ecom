name: Load nightly

# OPS-4 (docs/spec/07-scaling-ops.md AC-2, AC-3, Q-O3 e): แยกจาก ci.yml — ไม่รันบน PR จึงไม่กระทบกติกา merge
# ยังไม่มี staging: บูต stack แบบ prod (docker-compose.prod.yml) ใน runner เดียวกับ k6 (Q-O3 a)
# ผล k6 (--summary-export) + report.md เป็น artifact 14 วัน; nightly ไม่ commit ผลลง docs/evidence/
on:
  schedule:
    - cron: "0 19 * * *" # 02:00 Asia/Bangkok
  workflow_dispatch:
    inputs:
      # OPS-20a (spec 07 AC-31): "0" = ตัด scenario burst ของ flash-sale (รันเทียบ); schedule ไม่มี input → มี burst
      flash_burst:
        description: "flash-sale burst: 1 = มี (ค่าเริ่มต้น), 0 = ปิด"
        type: choice
        options: ["1", "0"]
        default: "1"
      # OPS-23 (spec 07 AC-38): เทียบ DATABASE_POOL_MAX ของ server/worker — ว่าง = default ของ Medusa (10); run.sh ตรวจว่าเป็นจำนวนเต็มบวก
      db_pool_max:
        description: "DATABASE_POOL_MAX: ว่าง = default ของ Medusa (10), เช่น 10 / 20 / 40"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: load-nightly
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: tools/load/run.sh
        env:
          LOAD_FLASH_BURST: ${{ inputs.flash_burst || '1' }}
          LOAD_DB_POOL_MAX: ${{ inputs.db_pool_max || '' }}
      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-nightly-${{ github.run_id }}
          path: tools/load/out/
          retention-days: 14
          if-no-files-found: warn
